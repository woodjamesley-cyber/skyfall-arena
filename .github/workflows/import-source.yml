name: Import source snapshot

# One-time bootstrap: GitHub credentials aren't available to the build agent,
# so the source archive is hosted briefly and imported here, where the
# workflow's own token can commit it. Delete this file after the import.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://skyfall-arena-source-handoff-z9f13o-preview.freebuff.site/skyfall-src.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source archive
        run: curl -fsSL "$SOURCE_URL" -o /tmp/skyfall-src.zip

      - name: Extract into repository
        run: unzip -o /tmp/skyfall-src.zip -d "$GITHUB_WORKSPACE"

      - name: Commit imported source
        run: |
          git config user.name "Skyfall Arena"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Skyfall Arena source" || echo "nothing to commit"
          git push origin HEAD:main
