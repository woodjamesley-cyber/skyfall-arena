name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APK to a GitHub Release (v1.0.0)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate launcher icons and splash screens
        run: python3 tools/gen_icons.py

      - name: Create signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SKYFALL_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/skyfall-release.keystore
          else
            keytool -genkeypair -v \
              -keystore android/skyfall-release.keystore \
              -alias skyfall \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${SKYFALL_KEYSTORE_PASSWORD}" \
              -keypass "${SKYFALL_KEY_PASSWORD}" \
              -dname "CN=Skyfall Arena, OU=Games, O=Skyfall Arena, L=Internet, C=US"
          fi

      - name: Build release APK
        working-directory: android
        env:
          SKYFALL_KEYSTORE: ${{ github.workspace }}/android/skyfall-release.keystore
          SKYFALL_KEYSTORE_PASSWORD: skyfall-dev-password
          SKYFALL_KEY_ALIAS: skyfall
          SKYFALL_KEY_PASSWORD: skyfall-dev-password
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 12
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyfall-arena-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: Skyfall Arena v1.0.0
          body: |
            Skyfall Arena 1.0.0 — original 3D battle royale for Android.

            Install the APK below (Android 7.0+, landscape, ~1.4 GB RAM recommended).
            Matches are offline against AI opponents.
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: false
